services:
  db:
    image: postgres:alpine
    container_name: postgres-db
    restart: always
    ports:
      - 1245:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: teamoopdb
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes:
  postgres-data:
    driver: local