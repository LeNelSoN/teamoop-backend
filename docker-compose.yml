services:
  app-backend:
    image: ghcr.io/lenelson/teamoop-backend:latest
    container_name: teamoop-backend
    ports:
      - 8080:8080
  redis:
    image: redis:7.4.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - teamoop-network
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "password"]
  database:
    image: postgres:12-alpine
    container_name: backend
    environment:
      - POSTGRES_DB=teamoopdb
      - POSTGRES_USER=teamoop
      - POSTGRES_PASSWORD=teamoop
    ports:
      - 1245:5432

networks:
  teamoop-network:
