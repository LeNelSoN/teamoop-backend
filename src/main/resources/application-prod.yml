
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/teamoopdb
    username: ${SPRING_DATABASE_USERNAME}
    password: ${SPRING_DATABASE_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
    contexts: prod
  security:
    enabled: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

redis:
  host: localhost
  port: 6379
  password: password
  ttl:
    duration: 10m
  redis:
    host: localhost
    port: 6379
    password: password
    ttl:
      duration: 10m

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    org:
      springframework:
        security: PROD
        web:
          cors: PROD
      springdoc: PROD