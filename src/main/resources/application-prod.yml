
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/teamoopdb
    initialization-mode: always
    username: ${SPRING_DATABASE_USERNAME}
    password: ${SPRING_DATABASE_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
    contexts: prod
  security:
    enabled: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
  encryption:
    key: 6de26826430254c3f53d73f3a046b1cd64869b8b73e15311227d9366ea220c49
  redis:
    host: localhost
    port: 6379
    password: password
    ttl:
      duration: 10m

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    org:
      springframework:
        security: PROD
        web:
          cors: PROD
      springdoc: PROD