
spring:
  datasource:
    url: jdbc:postgresql://localhost:1245/teamoopdb
    initialization-mode: always
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
    contexts: prod
  security:
    enabled: true

redis:
  host: localhost
  port: 6379
  password: password
  ttl:
    duration: 10m

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    org:
      springframework:
        security: PROD
        web:
          cors: PROD
      springdoc: PROD