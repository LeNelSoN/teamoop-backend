spring:
  datasource:
    url: ${SPRING_DATABASE_URL}
    username: ${SPRING_DATABASE_USERNAME}
    password: ${SPRING_DATABASE_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/master.xml
    enabled: true
    contexts: dev
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

redis:
  host: localhost
  port: 6379
  password: password
  ttl:
    duration: 10m