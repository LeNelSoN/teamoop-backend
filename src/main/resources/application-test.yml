spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: username
    password: password
    database-platform: org.hibernate.dialect.H2Dialect
    type: simple

  h2:
    console:
      enabled: true

  spring:
    jpa:
      show-sql: true
      ddl-auto: create-drop

  redis:
    host: localhost
    port: 6379
    password: password
    ttl:
      duration: 10m